<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Representation — Aura Sports Group</title>
  <meta name="description" content="Every level. One standard. Aura's approach evolves as your career evolves — from the first opportunity to life beyond the game.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .pathways-section { background: var(--ink-850); padding-top: 200px; padding-bottom: 120px; }
    @media (max-width: 900px) { .pathways-section { padding-top: 140px; } }
    .pathways { display: flex; gap: 24px; }
    @media (max-width: 1080px) { .pathways { flex-wrap: wrap; } .card-pathway { flex: 1 1 45%; min-width: 260px; } }
    @media (max-width: 640px) { .card-pathway { flex: 1 1 100%; } }
  </style>
</head>
<body class="nav-solid">
  <div id="nav-placeholder"></div>

  <!-- Who We Represent -->
  <section class="section pathways-section">
    <div class="pathways reveal">
      <a class="card-pathway" href="nfl.html">
        <div class="media media-ph" data-label="NFL Action Image">
          <img src="assets/img/nfl-action.jpg" alt="NFL player in action" style="object-position: 55% center;">
        </div>
        <div class="content">
          <h3>NFL</h3>
          <span class="explore">EXPLORE</span>
        </div>
        <span class="gold-edge"></span>
      </a>
      <a class="card-pathway" href="college-nil.html">
        <div class="media media-ph" data-label="College Football Image">
          <img class="college-photo" src="assets/img/college-football.jpg" alt="College football player">
        </div>
        <div class="content">
          <h3>College</h3>
          <span class="explore">EXPLORE</span>
        </div>
        <span class="gold-edge"></span>
      </a>
      <a class="card-pathway" href="high-school.html">
        <div class="media media-ph" data-label="High School Football Image">
          <img src="assets/img/high-school-football.jpg" alt="High school football player">
        </div>
        <div class="content">
          <h3>High School</h3>
          <span class="explore">EXPLORE</span>
        </div>
        <span class="gold-edge"></span>
      </a>
      <a class="card-pathway" href="coaches.html">
        <div class="media media-ph" data-label="Coach Image">
          <img src="assets/img/coach.jpg" alt="Football coach">
        </div>
        <div class="content">
          <h3>Coaches</h3>
          <span class="explore">EXPLORE</span>
        </div>
        <span class="gold-edge"></span>
      </a>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="js/site.js"></script>
</body>
</html>
