<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Team — Aura Sports Group</title>
  <meta name="description" content="The people behind every decision. Decades of combined experience across football representation, strategy and athlete care.">
  <link rel="icon" href="assets/img/favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .card-person {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
    }
    .card-person .media-ph {
      width: 128px;
      height: 128px;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
    }
    .card-person .media-ph::after { font-size: 8px; letter-spacing: 1.6px; }
    .card-person .name {
      font-family: var(--font-display);
      font-style: italic;
      font-weight: 800;
      font-size: 20px;
      line-height: 1.1;
      text-transform: uppercase;
      color: var(--white-off);
    }
    .card-person .role {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--gold-500);
    }
    @media (max-width: 520px) {
      .card-person .media-ph { width: 108px; height: 108px; }
    }
  </style>
</head>
<body class="nav-solid">
  <div id="nav-placeholder"></div>

  <!-- Hero -->
  <section class="page-hero" style="background: var(--ink-850); min-height: 0; padding: 140px var(--pad-x) 48px;">
    <h1>Our Team</h1>
  </section>

  <!-- Team grid -->
  <section class="section" style="padding-top: 40px; padding-bottom: 40px;">
    <div class="grid-4 reveal" style="row-gap: 44px;">
      <div class="card-person">
        <div class="media-ph" data-label="Team Photo">
          <img src="assets/img/team/member-01.jpg" alt="">
        </div>
        <div class="name">[ Name ]</div>
        <span class="role">Founder &amp; Chief Executive</span>
      </div>
      <div class="card-person">
        <div class="media-ph" data-label="Team Photo">
          <img src="assets/img/team/member-02.jpg" alt="">
        </div>
        <div class="name">[ Name ]</div>
        <span class="role">President, Football Operations</span>
      </div>
      <div class="card-person">
        <div class="media-ph" data-label="Team Photo">
          <img src="assets/img/team/member-03.jpg" alt="">
        </div>
        <div class="name">[ Name ]</div>
        <span class="role">Head of Marketing &amp; Brand</span>
      </div>
      <div class="card-person">
        <div class="media-ph" data-label="Team Photo">
          <img src="assets/img/team/member-04.jpg" alt="">
        </div>
        <div class="name">[ Name ]</div>
        <span class="role">Business &amp; Analytics</span>
      </div>
      <div class="card-person">
        <div class="media-ph" data-label="Team Photo">
          <img src="assets/img/team/member-05.jpg" alt="">
        </div>
        <div class="name">[ Name ]</div>
        <span class="role">Player Care &amp; Development</span>
      </div>
      <div class="card-person">
        <div class="media-ph" data-label="Team Photo">
          <img src="assets/img/team/member-06.jpg" alt="">
        </div>
        <div class="name">[ Name ]</div>
        <span class="role">Client Services</span>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="js/site.js"></script>
</body>
</html>
